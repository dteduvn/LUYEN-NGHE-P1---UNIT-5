<title>Luyện nghe – Communication – Making & accepting appointments (Lớp 6)</title>
<style>
:root{--g:#2E7D32;--gd:#1B5E20;--gl:#EEF6EE;--gm:#C8E6C9;--ink:#1B2A1D;--mut:#5F6F61;--red:#C62828;--redl:#FDECEA;--blue:#1565C0;--bluel:#E3F2FD;--ok:#2E7D32;--okl:#E8F5E9}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#F4F9F3;color:var(--ink);font-size:17px;line-height:1.5;padding-bottom:70px}
header{background:var(--gd);color:#fff;padding:18px 16px 14px}
header .k{font-size:13px;letter-spacing:1px;opacity:.85;margin:0}
header h1{margin:4px 0 2px;font-size:23px;line-height:1.25}
header p{margin:0;font-size:14px;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--gm);display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
nav button{flex:0 0 auto;border:2px solid var(--gm);background:#fff;color:var(--gd);font:600 15px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--g);border-color:var(--g);color:#fff}
main{max-width:860px;margin:0 auto;padding:14px 12px}
.card{background:#fff;border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{margin:0 0 10px;font-size:18px;color:var(--gd)}
.hint{color:var(--mut);font-size:14px;margin:0 0 10px}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gl);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.player .pp{width:52px;height:52px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:22px;cursor:pointer;flex:0 0 auto}
.player input[type=range]{flex:1 1 160px;accent-color:var(--g)}
.player .tm{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mut);min-width:84px}
.spd{display:flex;gap:4px}
.spd button{border:1px solid var(--gm);background:#fff;border-radius:8px;padding:4px 8px;font:600 13px inherit;font-family:inherit;color:var(--gd);cursor:pointer}
.spd button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 15px inherit;font-family:inherit;cursor:pointer;background:var(--g);color:#fff;min-height:44px}
.btn.alt{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q{padding:10px 0;border-top:1px dashed var(--gm)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:6px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:2px solid #E5EDE5;border-radius:10px;cursor:pointer}
.opt input{margin-top:4px}
.good{background:var(--okl)!important;border-color:var(--ok)!important}
.bad{background:var(--redl)!important;border-color:var(--red)!important}
.tf button{min-width:64px}
.tf button.sel{background:var(--gd);color:#fff}
select,input.gp,input.fi,textarea{font:inherit;font-family:inherit;border:2px solid #CFD8CF;border-radius:10px;padding:6px 8px;background:#fff}
input.gp{width:9.5em;padding:3px 6px;margin:0 2px}
input.fi{width:100%;max-width:320px}
textarea{width:100%;min-height:78px}
.script p{margin:0 0 8px}
.sp{font-weight:700;color:var(--gd)}
.done{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--okl);color:var(--gd);font-weight:700;font-size:18px}
.done.low{background:#FFF3E0;color:#8A4B00}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--gm)}
.line:first-child{border-top:0}
.play{width:44px;height:44px;border-radius:50%;border:2px solid var(--g);background:#fff;color:var(--g);font-size:18px;cursor:pointer;flex:0 0 auto}
.play.on{background:var(--g);color:#fff}
.txt.hid{filter:blur(6px);user-select:none}
.diff span{padding:0 2px;border-radius:4px}
.diff .w-ok{background:var(--okl);color:var(--gd)}
.diff .w-bad{background:var(--redl);color:var(--red);text-decoration:underline}
.diff .w-miss{background:#FFF3E0;color:#8A4B00}
.dprog{height:8px;background:var(--gl);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.dprog i{display:block;height:100%;background:var(--g);width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.col{border:2px dashed var(--gm);border-radius:12px;padding:10px;min-height:80px}
.col h3{margin:0 0 6px;font-size:16px;color:var(--gd)}
.sec[hidden]{display:none}
.vt{width:100%;border-collapse:collapse}.vt td{padding:8px 6px;border-top:1px dashed var(--gm);vertical-align:middle}
.vt .w{font-weight:700;font-size:18px}.vt .ipa{color:var(--mut);font-size:14px}.vt .vi.hid,.ph .vi.hid{visibility:hidden}
.ph{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--gm)}.ph .en{font-weight:600}.ph .vi{color:var(--mut);font-size:15px}
.fc{border:2px solid var(--gm);border-radius:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;cursor:pointer;background:#FBFDFB}
.fc .big{font-size:28px;font-weight:800;color:var(--gd)}
.small{font-size:14px;color:var(--mut)}
@media (max-width:520px){header h1{font-size:20px}body{font-size:16px}}
</style>

  var o={key:CFG.key,lop:'Lớp 6',name:name||'(chưa nhập tên)',unit:CFG.unit,activity:a.slice(0,90),score:sc[0],total:Math.min(sc[1],100),attempt:att[a],text:CFG.web,time:new Date().toISOString()};
  try{fetch(CFG.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o),keepalive:true}).catch(function(){})}catch(e){}}
 function scan(){var L=document.querySelectorAll('.endbig, div.done, .fb.ok');
  for(var i=0;i<L.length;i++){var c=L[i],el=c.classList.contains('endbig')?(c.closest('.card')||c.parentNode):c;
   if(!el||el.getAttribute('data-dtrep'))continue;
   if(c.classList.contains('fb')){if(!/Hoàn thành/.test(c.textContent)||c.querySelector('div.done')||c.closest('div.done'))continue}
   if(el.closest('[data-dtrep]'))continue;
   el.setAttribute('data-dtrep','1');send(el)}}
 var tm=null;new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(scan,250)}).observe(document.body,{childList:true,subtree:true});
 chip();if(!name)gate();
 window.DT_REPORT={scan:scan,act:act};
})();
</script>
